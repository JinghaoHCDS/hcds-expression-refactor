" fill="#EBCB75" opacity="1.000" transform="rotate(0.00 712.00 340.00)"/><text x="712.00" y="340.00" font-size="27" fill="#343A46" font-weight="500" transform="rotate(0.00 712.00 340.00)" opacity="1.000">我真的有点烦。</text><text x="83" y="331" font-size="27" fill="#343A46" font-weight="400" transform="rotate(4 83 331)" opacity="0.300">录了五遍，</text><text x="712.00" y="419.00" font-size="27" fill="#343A46" font-weight="500" transform="rotate(0.00 712.00 419.00)" opacity="1.000">录了五遍，</text><text x="274" y="377" font-size="27" fill="#343A46" font-weight="400" transform="rotate(-3 274 377)" opacity="0.300">每次都卡在开头。</text><text x="847.00" y="419.00" font-size="27" fill="#343A46" font-weight="500" transform="rotate(0.00 847.00 419.00)" opacity="1.000">每次都卡在开头。</text><text x="66" y="473" font-size="27" fill="#343A46" font-weight="400" transform="rotate(2 66 473)" opacity="0.300">后来挑了一遍能讲清楚的，</text><text x="712.00" y="500.00" font-size="27" fill="#343A46" font-weight="500" transform="rotate(0.00 712.00 500.00)" opacity="1.000">后来挑了一遍能讲清楚的，</text><text x="369" y="531" font-size="27" fill="#343A46" font-weight="400" transform="rotate(-5 369 531)" opacity="0.300">就发了。</text><text x="712.00" y="535.00" font-size="27" fill="#343A46" font-weight="500" transform="rotate(0.00 712.00 535.00)" opacity="1.000">就发了。</text><g clip-path="url(#filler-side)"><text x="556.00" y="318.00" font-size="21" fill="#343A46" font-weight="400" opacity="0.000">嗯嗯</text><path d="M601 302 V321" fill="none" stroke="#EBCB75" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.000"/><text x="556.00" y="395.00" font-size="21" fill="#343A46" font-weight="400" opacity="0.000">那个</text><path d="M601 379 V398" fill="none" stroke="#EBCB75" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.000"/><text x="556.00" y="514.00" font-size="21" fill="#343A46" font-weight="400" opacity="0.000">这个</text><path d="M601 498 V517" fill="none" stroke="#EBCB75" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.000"/></g><text x="55" y="589" font-size="27" fill="#343A46" font-weight="500" >删掉口水话，留下你的话。</text><text x="971" y="589" font-size="18" fill="#343A46" font-weight="400" >口述改写演示</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">想到哪说到哪，最后讲得明明白白</title><desc id="desc">三个无意义口头填充示例“嗯嗯、那个、这个”被中间挡板截住并淡出；有效内容通过后，按感受、痛点、办法归位，并解释每段的作用。</desc>
<rect width="1200" height="620" fill="#BECBEB"/>
<g font-family="'PingFang SC', 'Helvetica Neue', sans-serif"><text x="54" y="48" font-size="19" fill="#343A46" font-weight="700" letter-spacing="1.2">HCDS  /  EXPRESSION REFACTOR</text><text x="54" y="128" font-size="59" fill="#343A46" font-weight="800" stroke="#343A46" stroke-width="0.65" paint-order="stroke">想到哪，说到哪。</text><text x="54" y="198" font-size="59" fill="#343A46" font-weight="800" stroke="#343A46" stroke-width="0.65" paint-order="stroke">最后，讲得明明白白。</text><text x="969" y="73" font-size="51" fill="#0C91FA" font-weight="800" stroke="#0C91FA" stroke-width="0.5" paint-order="stroke">排句</text><text x="971" y="105" font-size="18" fill="#343A46" font-weight="600" >去噪 · 梳理 · 成稿</text><text x="59" y="271" font-size="22" fill="#343A46" font-weight="600" >散落的口述</text><text x="712" y="271" font-size="22" fill="#343A46" font-weight="600" >可以直接念的稿</text><text x="586" y="271" font-size="20" fill="#343A46" font-weight="600" >去噪</text><defs><clipPath id="filler-side"><rect x="0" y="290" width="615" height="268"/></clipPath></defs><rect x="618" y="296" width="6" height="254" fill="#343A46" rx="3"/><path d="M610 309 H619" fill="none" stroke="#343A46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/><path d="M610 327 H619" fill="none" stroke="#343A46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/><path d="M610 345 H619" fill="none" stroke="#343A46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/><path d="M610 363 H619" fill="none" stroke="#343A46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/><path d="M610 381 H619" fill="none" stroke="#343A46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/><path d="M610 399 H619" fill="none" stroke="#343A46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/><path d="M610 417 H619" fill="none" stroke="#343A46" stroke-width="2" stroke-linecap="round" stroke-